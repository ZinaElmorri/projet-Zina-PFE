server:
  port: 8080

spring:
  application:
    name: sepa-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sepa_db}
    username: ${SPRING_DATASOURCE_USERNAME:sepa}
    password: ${SPRING_DATASOURCE_PASSWORD:sepa_pwd}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # SMTP : MailHog en développement (http://localhost:8025 pour lire les emails)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  jwt:
    secret: ${JWT_SECRET:changez-cette-cle-secrete-tres-longue-pour-la-production-123456789}
    expiration-ms: 86400000
  ai:
    enabled: ${AI_ENABLED:true}
    url: ${AI_MODULE_URL:http://localhost:8000}
    timeout-ms: ${AI_TIMEOUT_MS:5000}
    score-threshold: ${AI_SCORE_THRESHOLD:0.6}
    history-months: ${AI_HISTORY_MONTHS:6}
  otp:
    enabled: ${OTP_ENABLED:true}
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-resends: ${OTP_MAX_RESENDS:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:30}
    mail-from: ${MAIL_FROM:no-reply@sepa.local}
  storage:
    xsd-dir: ${XSD_DIR:./uploads/xsd}
    xml-dir: ${XML_DIR:./generated-xml}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.zina.sepa: DEBUG
